[package]
name = "hilol"
version = "0.1.0"
edition = "2021"
description = "no bs static site generator"
license = "MIT"

[dependencies]
serde = {version="1.0.228", features=["derive"]}
tera = "1.20.1"
toml = "1.1.2"
clap = {version="4.5", features=["derive"]}
walkdir = "2.4"
pulldown-cmark = {version = "0.13"}
anyhow = "1.0"
rayon = "1.8"
sha2 = "0.10"
serde_json = "1.0"
tokio = {version="1.40", features=["full"]}
axum = "0.7"
tower = "0.4"
tower-http = {version="0.5", features=["trace", "fs"]}
notify = "6.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = "z"
strip = true
